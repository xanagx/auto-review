name: AI Auto-Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Auto-Review
        run: |
          pip install .

      - name: Run Auto-Review on PR
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Or OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          auto-review review --git "origin/${{ github.base_ref }}...HEAD" --format markdown > review_output.md

      - name: Post Review Comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('review_output.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
